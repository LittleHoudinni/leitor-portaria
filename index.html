<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portaria - Controle de Acesso</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .header {
      background: #1f2937;
      color: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .camera-box {
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #e5e7eb;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .status.erro {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.processando {
      background: #fef3c7;
      color: #92400e;
    }

    .resultado {
      display: none;
      margin-top: 15px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }

    .resultado.show {
      display: block;
    }

    .movimento {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .entrada {
      color: #15803d;
    }

    .saida {
      color: #dc2626;
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .informacao {
      font-size: 14px;
      color: #555;
      margin: 4px 0;
    }

    .horario {
      margin-top: 12px;
      font-size: 14px;
      color: #777;
    }

    .historico {
      margin-top: 15px;
      background: white;
      border-radius: 12px;
      padding: 15px;
    }

    .historico h2 {
      font-size: 17px;
      margin-top: 0;
    }

    .item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item strong {
      display: block;
    }

    .debug {
      margin-top: 15px;
      padding: 10px;
      background: #111827;
      color: #d1d5db;
      border-radius: 8px;
      font-size: 11px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .oculto {
      display: none;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>CONTROLE DE ACESSO</h1>

    <p>Leitor QR Code - Portaria da Obra</p>

  </div>


  <div class="camera-box">

    <div id="reader"></div>

    <div
      id="status"
      class="status"
    >
      Iniciando câmera...
    </div>

  </div>


  <div
    id="resultado"
    class="resultado"
  >

    <div
      id="movimento"
      class="movimento"
    ></div>

    <div
      id="nome"
      class="nome"
    ></div>

    <div
      id="funcao"
      class="informacao"
    ></div>

    <div
      id="cracha"
      class="informacao"
    ></div>

    <div
      id="empresa"
      class="informacao"
    ></div>

    <div
      id="horario"
      class="horario"
    ></div>

  </div>


  <div class="historico">

    <h2>Últimos registros</h2>

    <div id="listaHistorico"></div>

  </div>


  <div
    id="debug"
    class="debug"
  >
    Sistema iniciando...
  </div>

</div>


<script>

  /*
   ============================================================
   CONFIGURAÇÃO
   ============================================================
  */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyZBhTKwNDK8-DEnZIdjFS2krTDGtU4IrOOC_QqDO1cUJuOc90BW5HlC3pQTZsfJsF_/exec";


  /*
   ============================================================
   VARIÁVEIS
   ============================================================
  */

  let scanner = null;

  let processando = false;

  let ultimoCracha = "";

  let ultimoTempo = 0;

  const TEMPO_ANTI_DUPLICACAO = 5000;


  /*
   ============================================================
   ELEMENTOS
   ============================================================
  */

  const statusEl =
    document.getElementById("status");

  const resultadoEl =
    document.getElementById("resultado");

  const movimentoEl =
    document.getElementById("movimento");

  const nomeEl =
    document.getElementById("nome");

  const funcaoEl =
    document.getElementById("funcao");

  const crachaEl =
    document.getElementById("cracha");

  const empresaEl =
    document.getElementById("empresa");

  const horarioEl =
    document.getElementById("horario");

  const debugEl =
    document.getElementById("debug");

  const listaHistoricoEl =
    document.getElementById("listaHistorico");


  /*
   ============================================================
   STATUS
   ============================================================
  */

  function definirStatus(
    mensagem,
    tipo = ""
  ) {

    statusEl.textContent = mensagem;

    statusEl.className =
      "status " + tipo;

  }


  /*
   ============================================================
   DEBUG
   ============================================================
  */

  function debug(mensagem) {

    const agora =
      new Date().toLocaleTimeString("pt-BR");

    debugEl.textContent =
      "[" + agora + "] " + mensagem;

  }


  /*
   ============================================================
   NORMALIZAÇÃO DO CRACHÁ
   ============================================================
  */

  function normalizarCracha(valor) {

    if (!valor) {
      return "";
    }

    let texto =
      String(valor)
        .trim()
        .toUpperCase();

    texto =
      texto.replace(/\s+/g, " ");

    /*
      CRA - 009
      CRA-009
      CRA 009
    */

    const match =
      texto.match(
        /CRA\s*-\s*(\d+)/i
      );

    if (match) {

      return (
        "CRA - " +
        String(match[1]).padStart(3, "0")
      );

    }

    return texto;

  }


  /*
   ============================================================
   EXTRAI CRACHÁ DO QR
   ============================================================
  */

  function extrairCracha(texto) {

    if (!texto) {
      return "";
    }

    texto =
      String(texto).trim();


    /*
      Se for uma URL
    */

    try {

      if (
        texto.startsWith("http://") ||
        texto.startsWith("https://")
      ) {

        const url =
          new URL(texto);

        const id =
          url.searchParams.get("id");

        if (id) {

          return normalizarCracha(id);

        }

      }

    } catch (erro) {

      debug(
        "Erro ao interpretar URL: " +
        erro.message
      );

    }


    /*
      Se for o próprio crachá
    */

    return normalizarCracha(texto);

  }


  /*
   ============================================================
   QR DETECTADO
   ============================================================
  */

  function qrDetectado(decodedText) {

    debug(
      "QR DETECTADO: " +
      decodedText
    );


    const cracha =
      extrairCracha(decodedText);


    if (!cracha) {

      definirStatus(
        "QR inválido",
        "erro"
      );

      return;

    }


    debug(
      "Crachá identificado: " +
      cracha
    );


    const agora =
      Date.now();


    /*
      Evita registrar o mesmo QR
      várias vezes seguidas
    */

    if (
      processando
    ) {

      return;

    }


    if (
      cracha === ultimoCracha &&
      agora - ultimoTempo <
        TEMPO_ANTI_DUPLICACAO
    ) {

      return;

    }


    ultimoCracha =
      cracha;

    ultimoTempo =
      agora;


    registrarAcesso(cracha);

  }


  /*
   ============================================================
   REGISTRAR ACESSO
   ============================================================
  */

  function registrarAcesso(cracha) {

    processando = true;


    definirStatus(
      "Registrando " + cracha + "...",
      "processando"
    );


    debug(
      "Enviando para o sistema..."
    );


    chamarAPI(
      cracha,
      function(resposta) {

        debug(
          "Resposta recebida: " +
          JSON.stringify(resposta)
        );


        if (
          resposta &&
          resposta.sucesso
        ) {

          mostrarResultado(
            resposta
          );

          salvarHistorico(
            resposta
          );

          definirStatus(
            "✓ Acesso registrado com sucesso",
            "ok"
          );


          /*
            Som no celular/computador
          */

          emitirSom();


          /*
            Vibração no celular
          */

          vibrar();


          /*
            Depois de um pequeno intervalo,
            volta para modo de leitura.
          */

          setTimeout(
            function() {

              processando =
                false;

              resultadoEl.classList.remove(
                "show"
              );

              definirStatus(
                "Aguardando próximo crachá..."
              );

              debug(
                "Leitor pronto para o próximo QR."
              );

            },
            1800
          );


        } else {

          const erro =
            resposta &&
            resposta.erro
              ? resposta.erro
              : "Erro desconhecido.";

          definirStatus(
            "Erro: " + erro,
            "erro"
          );


          debug(
            "ERRO DO SISTEMA: " +
            erro
          );


          processando =
            false;

        }

      },
      function(erro) {

        definirStatus(
          "Erro de comunicação com o sistema",
          "erro"
        );


        debug(
          "ERRO DE COMUNICAÇÃO: " +
          erro
        );


        processando =
          false;

      }
    );

  }


  /*
   ============================================================
   JSONP
   ============================================================
  */

  function chamarAPI(
    cracha,
    sucesso,
    erro
  ) {

    const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement("script");


    let finalizado =
      false;


    const timeout =
      setTimeout(
        function() {

          if (finalizado) {
            return;
          }

          finalizado = true;


          try {
            delete window[callbackName];
          } catch (e) {}


          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }


          erro(
            "Tempo limite de comunicação com o Apps Script."
          );

        },
        15000
      );


    window[callbackName] =
      function(resposta) {

        if (finalizado) {
          return;
        }

        finalizado = true;


        clearTimeout(
          timeout
        );


        try {
          delete window[callbackName];
        } catch (e) {}


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        sucesso(
          resposta
        );

      };


    const url =
      API_URL +
      "?acao=registrar" +
      "&id=" +
      encodeURIComponent(cracha) +
      "&callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();


    debug(
      "Chamando API..."
    );


    script.src =
      url;


    script.async =
      true;


    script.onerror =
      function() {

        if (finalizado) {
          return;
        }

        finalizado = true;


        clearTimeout(
          timeout
        );


        try {
          delete window[callbackName];
        } catch (e) {}


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        erro(
          "O navegador bloqueou a comunicação com o Apps Script."
        );

      };


    document.head.appendChild(
      script
    );

  }


  /*
   ============================================================
   MOSTRAR RESULTADO
   ============================================================
  */

  function mostrarResultado(
    resposta
  ) {

    resultadoEl.classList.add(
      "show"
    );


    movimentoEl.textContent =
      resposta.movimento === "ENTRADA"
        ? "✓ ENTRADA"
        : "✓ SAÍDA";


    movimentoEl.className =
      "movimento " +
      (
        resposta.movimento === "ENTRADA"
          ? "entrada"
          : "saida"
      );


    nomeEl.textContent =
      resposta.nome || "";


    funcaoEl.textContent =
      resposta.funcao
        ? "Função: " +
          resposta.funcao
        : "";


    crachaEl.textContent =
      resposta.cracha
        ? "Crachá: " +
          resposta.cracha
        : "";


    empresaEl.textContent =
      resposta.empresa
        ? "Empresa: " +
          resposta.empresa
        : "";


    horarioEl.textContent =
      resposta.horario
        ? "Horário: " +
          resposta.horario
        : "";

  }


  /*
   ============================================================
   HISTÓRICO
   ============================================================
  */

  function salvarHistorico(
    resposta
  ) {

    let historico =
      JSON.parse(
        localStorage.getItem(
          "historico_portaria"
        ) || "[]"
      );


    historico.unshift({

      nome:
        resposta.nome || "",

      cracha:
        resposta.cracha || "",

      movimento:
        resposta.movimento || "",

      horario:
        resposta.horario || "",

      empresa:
        resposta.empresa || ""

    });


    historico =
      historico.slice(
        0,
        10
      );


    localStorage.setItem(
      "historico_portaria",
      JSON.stringify(
        historico
      )
    );


    mostrarHistorico();

  }


  function mostrarHistorico() {

    const historico =
      JSON.parse(
        localStorage.getItem(
          "historico_portaria"
        ) || "[]"
      );


    if (
      historico.length === 0
    ) {

      listaHistoricoEl.innerHTML =
        "<div class='informacao'>Nenhum registro ainda.</div>";

      return;

    }


    listaHistoricoEl.innerHTML =
      historico.map(
        function(item) {

          const classe =
            item.movimento === "ENTRADA"
              ? "entrada"
              : "saida";


          return `
            <div class="item">

              <strong>
                ${escapar(item.nome)}
              </strong>

              <span>
                ${escapar(item.cracha)}
              </span>

              <span class="${classe}">
                ${escapar(item.movimento)}
              </span>

              <span>
                ${escapar(item.horario)}
              </span>

            </div>
          `;

        }
      ).join("");

  }


  /*
   ============================================================
   ESCAPAR HTML
   ============================================================
  */

  function escapar(valor) {

    if (
      valor === null ||
      valor === undefined
    ) {

      return "";

    }


    return String(valor)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   ============================================================
   SOM
   ============================================================
  */

  function emitirSom() {

    try {

      const contexto =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      const oscilador =
        contexto.createOscillator();


      const ganho =
        contexto.createGain();


      oscilador.connect(
        ganho
      );

      ganho.connect(
        contexto.destination
      );


      oscilador.frequency.value =
        1000;


      ganho.gain.value =
        0.15;


      oscilador.start();


      setTimeout(
        function() {

          oscilador.stop();

          contexto.close();

        },
        150
      );

    } catch (e) {}

  }


  /*
   ============================================================
   VIBRAÇÃO
   ============================================================
  */

  function vibrar() {

    try {

      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [100, 50, 100]
        );

      }

    } catch (e) {}

  }


  /*
   ============================================================
   INICIAR CÂMERA
   ============================================================
  */

  async function iniciarCamera() {

    definirStatus(
      "Iniciando câmera..."
    );


    debug(
      "Inicializando leitor QR..."
    );


    try {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 10,

        qrbox: function(
          largura,
          altura
        ) {

          const tamanho =
            Math.min(
              largura,
              altura
            ) * 0.70;

          return {
            width: tamanho,
            height: tamanho
          };

        },

        aspectRatio: 1.0,

        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],

        rememberLastUsedCamera: true,

        showTorchButtonIfSupported: true

      };


      /*
        IMPORTANTE:
        html5-qrcode 2.3.8 aceita
        facingMode como string.
      */

      await scanner.start(

        {
          facingMode: "environment"
        },

        config,

        function(decodedText) {

          qrDetectado(
            decodedText
          );

        },

        function(errorMessage) {

          /*
            Erros de leitura são normais
            enquanto procura o QR.

            Não mostramos esses erros
            na tela para não poluir.
          */

        }

      );


      definirStatus(
        "Aguardando leitura do crachá..."
      );


      debug(
        "Câmera iniciada com sucesso."
      );


    } catch (erro) {

      definirStatus(
        "Não foi possível iniciar a câmera.",
        "erro"
      );


      debug(
        "ERRO AO INICIAR CÂMERA: " +
        (
          erro &&
          erro.message
            ? erro.message
            : erro
        )
      );

    }

  }


  /*
   ============================================================
   INICIALIZAÇÃO
   ============================================================
  */

  window.addEventListener(
    "load",
    function() {

      mostrarHistorico();

      iniciarCamera();

    }
  );

</script>

</body>

</html>
