<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Leitor QR - Portaria</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      background: #111;
      color: white;

      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;

      margin: auto;

      padding: 15px;
    }

    h1 {
      text-align: center;

      font-size: 24px;

      margin: 10px 0 5px;
    }

    .subtitulo {
      text-align: center;

      color: #aaa;

      font-size: 14px;

      margin-bottom: 15px;
    }

    #reader {

      width: 100%;

      background: black;

      border-radius: 15px;

      overflow: hidden;
    }

    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;
    }

    .status {

      margin-top: 12px;

      padding: 14px;

      border-radius: 10px;

      text-align: center;

      background: #222;

      color: white;

      font-size: 15px;
    }

    .status.ok {
      background: #123d20;

      color: #7dff9b;
    }

    .status.erro {
      background: #481818;

      color: #ff9999;
    }

    .status.lendo {
      background: #3e3510;

      color: #ffe27a;
    }

    .debug {

      margin-top: 10px;

      padding: 10px;

      background: #1b1b1b;

      border-radius: 8px;

      font-size: 12px;

      color: #888;

      word-break: break-all;
    }

    .resultado {

      display: none;

      margin-top: 15px;

      padding: 20px;

      background: #1d1d1d;

      border-radius: 12px;

      text-align: center;
    }

    .resultado.mostrar {
      display: block;
    }

    .movimento {

      font-size: 30px;

      font-weight: bold;

      margin-bottom: 10px;
    }

    .entrada {
      color: #52e37b;
    }

    .saida {
      color: #ff6464;
    }

    .nome {

      font-size: 21px;

      font-weight: bold;
    }

    .funcao {

      color: #bbb;

      margin-top: 5px;
    }

    .cracha {

      color: #888;

      margin-top: 5px;
    }

    .horario {

      color: #aaa;

      font-size: 13px;

      margin-top: 8px;
    }

    .historico {

      margin-top: 20px;
    }

    .historico h2 {

      font-size: 17px;

      margin-bottom: 10px;
    }

    .item {

      padding: 12px;

      margin-bottom: 7px;

      background: #1c1c1c;

      border-radius: 8px;

      font-size: 14px;
    }

    .item-entrada {

      border-left: 4px solid #52e37b;
    }

    .item-saida {

      border-left: 4px solid #ff6464;
    }

    .item strong {

      display: block;
    }

    .item small {

      color: #999;
    }

    button {

      width: 100%;

      margin-top: 12px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #333;

      color: white;

      font-size: 16px;

      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 LEITOR QR</h1>

  <div class="subtitulo">

    Controle de entrada e saída da obra

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status"
  >

    Iniciando câmera...

  </div>


  <div
    id="debug"
    class="debug"
  >

    Aguardando leitura do QR Code...

  </div>


  <div
    id="resultado"
    class="resultado"
  >

    <div
      id="movimento"
      class="movimento"
    ></div>

    <div
      id="nome"
      class="nome"
    ></div>

    <div
      id="funcao"
      class="funcao"
    ></div>

    <div
      id="cracha"
      class="cracha"
    ></div>

    <div
      id="horario"
      class="horario"
    ></div>

  </div>


  <button
    onclick="reiniciarCamera()"
  >

    🔄 REINICIAR CÂMERA

  </button>


  <div class="historico">

    <h2>
      Últimas leituras
    </h2>

    <div id="listaHistorico"></div>

  </div>

</div>


<script>


/******************************************************
 * CONFIGURAÇÃO
 ******************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZBhTKwNDK8-DEnZIdjFS2krTDGtU4IrOOC_QqDO1cUJuOc90BW5HlC3pQTZsfJsF_/exec';


/******************************************************
 * VARIÁVEIS
 ******************************************************/

let scanner = null;

let processando = false;

let ultimoCracha = '';

let ultimaLeitura = 0;

const TEMPO_DUPLICADO = 4000;

const historico = [];


/******************************************************
 * ELEMENTOS
 ******************************************************/

const statusEl =
  document.getElementById('status');

const debugEl =
  document.getElementById('debug');

const resultadoEl =
  document.getElementById('resultado');

const movimentoEl =
  document.getElementById('movimento');

const nomeEl =
  document.getElementById('nome');

const funcaoEl =
  document.getElementById('funcao');

const crachaEl =
  document.getElementById('cracha');

const horarioEl =
  document.getElementById('horario');

const listaHistoricoEl =
  document.getElementById('listaHistorico');


/******************************************************
 * STATUS
 ******************************************************/

function status(
  texto,
  tipo = ''
) {

  statusEl.textContent = texto;

  statusEl.className =
    'status ' + tipo;

}


/******************************************************
 * INICIAR
 ******************************************************/

async function iniciarCamera() {

  status(
    'Solicitando câmera...'
  );

  try {

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {}

      try {

        await scanner.clear();

      } catch (e) {}

    }


    scanner =
      new Html5Qrcode(
        'reader',
        {
          verbose: false
        }
      );


    /*
     * Configuração específica
     * para QR Code.
     */

    const config = {

      fps: 20,

      qrbox: function(
        largura,
        altura
      ) {

        const tamanho =
          Math.floor(
            Math.min(
              largura,
              altura
            ) * 0.80
          );

        return {

          width: tamanho,

          height: tamanho

        };

      },

      aspectRatio: 1.7777778,

      disableFlip: false,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE

      ]

    };


    /*
     * Tenta câmera traseira.
     */

    await scanner.start(

      {
        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      },

      config,

      function(
        decodedText,
        decodedResult
      ) {

        qrDetectado(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Os erros de tentativa
         * de leitura são normais.
         */

      }

    );


    status(
      '🟢 CÂMERA ATIVA — APONTE PARA O QR CODE',
      'ok'
    );


    debugEl.textContent =
      'Câmera ativa. Aguardando QR Code...';

  }

  catch (erro) {

    console.error(
      'ERRO CÂMERA:',
      erro
    );


    status(
      '❌ Não foi possível iniciar a câmera.',
      'erro'
    );


    debugEl.textContent =
      String(erro);

  }

}


/******************************************************
 * QR DETECTADO
 ******************************************************/

function qrDetectado(
  texto
) {

  if (!texto) {

    return;

  }


  /*
   * MOSTRA O QUE REALMENTE
   * ESTÁ DENTRO DO QR.
   *
   * Isso é muito importante
   * para nosso diagnóstico.
   */

  debugEl.textContent =
    'QR DETECTADO: ' +
    texto;


  const cracha =
    extrairCracha(
      texto
    );


  if (!cracha) {

    status(
      '⚠️ QR lido, mas não foi possível identificar o crachá.',
      'erro'
    );

    return;

  }


  const agora =
    Date.now();


  /*
   * Evita várias leituras
   * do mesmo QR.
   */

  if (

    cracha === ultimoCracha &&

    agora - ultimaLeitura <
      TEMPO_DUPLICADO

  ) {

    return;

  }


  ultimoCracha =
    cracha;

  ultimaLeitura =
    agora;


  if (processando) {

    return;

  }


  processando = true;


  status(
    '⏳ Registrando ' + cracha + '...',
    'lendo'
  );


  registrarNaAPI(
    cracha
  );

}


/******************************************************
 * EXTRAIR CRACHÁ
 ******************************************************/

function extrairCracha(
  texto
) {

  texto =
    String(
      texto || ''
    ).trim();


  if (!texto) {

    return '';

  }


  /*
   * Caso o QR contenha
   * diretamente:
   *
   * CRA - 009
   */

  if (
    /^CRA[\s_-]*\d+/i.test(
      texto
    )
  ) {

    return normalizarCracha(
      texto
    );

  }


  /*
   * Caso seja uma URL.
   *
   * Exemplo:
   *
   * https://script.google.com/...
   * ?acao=portaria&id=CRA%20-%20009
   */

  try {

    const url =
      new URL(texto);


    const id =
      url.searchParams.get(
        'id'
      );


    if (id) {

      return normalizarCracha(
        id
      );

    }

  }

  catch (erro) {

    /*
     * Não é problema.
     */

  }


  /*
   * Fallback.
   */

  const match =
    texto.match(
      /[?&]id=([^&#]+)/i
    );


  if (match) {

    try {

      return normalizarCracha(
        decodeURIComponent(
          match[1]
        )
      );

    }

    catch (erro) {

      return normalizarCracha(
        match[1]
      );

    }

  }


  return normalizarCracha(
    texto
  );

}


/******************************************************
 * NORMALIZAR
 ******************************************************/

function normalizarCracha(
  valor
) {

  return String(
    valor || ''
  )
    .trim()
    .toUpperCase();

}


/******************************************************
 * API
 ******************************************************/

function registrarNaAPI(
  cracha
) {

  const callback =
    'qrCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      'script'
    );


  let finalizado =
    false;


  window[callback] =
    function(resposta) {

      if (finalizado) {

        return;

      }


      finalizado = true;


      try {

        script.remove();

      } catch (e) {}


      try {

        delete window[callback];

      } catch (e) {}


      processarResposta(
        resposta
      );

    };


  const url =

    API_URL +

    '?acao=registrar' +

    '&id=' +

    encodeURIComponent(
      cracha
    ) +

    '&callback=' +

    encodeURIComponent(
      callback
    );


  script.src =
    url;


  script.onerror =
    function() {

      if (finalizado) {

        return;

      }


      finalizado = true;


      status(
        '❌ Erro de comunicação com o sistema.',
        'erro'
      );


      debugEl.textContent =
        'Erro ao acessar a API.';


      processando =
        false;


      try {

        delete window[callback];

      } catch (e) {}

    };


  document
    .head
    .appendChild(
      script
    );

}


/******************************************************
 * RESPOSTA
 ******************************************************/

function processarResposta(
  resposta
) {

  if (
    !resposta ||
    resposta.sucesso !== true
  ) {

    status(

      '❌ ' +

      (
        resposta &&
        resposta.erro
          ? resposta.erro
          : 'Erro ao registrar.'
      ),

      'erro'

    );


    debugEl.textContent =
      JSON.stringify(
        resposta
      );


    processando =
      false;


    setTimeout(
      function() {

        status(
          '🟢 CÂMERA ATIVA — APONTE PARA O QR CODE',
          'ok'
        );

      },
      1800
    );


    return;

  }


  mostrarResultado(
    resposta
  );


  adicionarHistorico(
    resposta
  );


  status(
    '🟢 REGISTRO REALIZADO',
    'ok'
  );


  debugEl.textContent =

    'QR: ' +

    resposta.cracha;


  setTimeout(
    function() {

      processando =
        false;

    },
    500
  );

}


/******************************************************
 * RESULTADO
 ******************************************************/

function mostrarResultado(
  dados
) {

  resultadoEl.classList.add(
    'mostrar'
  );


  if (
    dados.movimento ===
    'ENTRADA'
  ) {

    movimentoEl.textContent =
      '🟢 ENTRADA';

    movimentoEl.className =
      'movimento entrada';

  }

  else {

    movimentoEl.textContent =
      '🔴 SAÍDA';

    movimentoEl.className =
      'movimento saida';

  }


  nomeEl.textContent =
    dados.nome || '';


  funcaoEl.textContent =
    dados.funcao || '';


  crachaEl.textContent =
    'Crachá: ' +
    (
      dados.cracha || ''
    );


  horarioEl.textContent =
    dados.horario || '';

}


/******************************************************
 * HISTÓRICO
 ******************************************************/

function adicionarHistorico(
  dados
) {

  historico.unshift(
    dados
  );


  if (
    historico.length > 10
  ) {

    historico.pop();

  }


  listaHistoricoEl.innerHTML =
    '';


  historico.forEach(
    function(item) {

      const div =
        document.createElement(
          'div'
        );


      div.className =

        'item ' +

        (
          item.movimento ===
          'ENTRADA'

            ? 'item-entrada'

            : 'item-saida'
        );


      div.innerHTML =

        '<strong>' +

        (
          item.movimento ===
          'ENTRADA'

            ? '🟢 ENTRADA'

            : '🔴 SAÍDA'
        ) +

        ' — ' +

        escapar(
          item.nome
        ) +

        '</strong>' +

        '<small>' +

        escapar(
          item.cracha
        ) +

        ' | ' +

        escapar(
          item.horario
        ) +

        '</small>';


      listaHistoricoEl.appendChild(
        div
      );

    }
  );

}


/******************************************************
 * ESCAPAR HTML
 ******************************************************/

function escapar(
  texto
) {

  return String(
    texto || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/******************************************************
 * REINICIAR
 ******************************************************/

async function reiniciarCamera() {

  status(
    'Reiniciando câmera...'
  );


  try {

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {}


      try {

        await scanner.clear();

      } catch (e) {}

    }

  }

  catch (e) {}


  scanner =
    null;


  processando =
    false;


  ultimoCracha =
    '';


  ultimaLeitura =
    0;


  setTimeout(
    iniciarCamera,
    500
  );

}


/******************************************************
 * INICIAR AO ABRIR
 ******************************************************/

window.addEventListener(
  'load',
  function() {

    setTimeout(
      iniciarCamera,
      500
    );

  }
);

</script>

</body>

</html>
