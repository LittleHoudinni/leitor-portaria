<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Portaria - Leitor QR</title>

  <!-- Biblioteca de leitura de QR Code -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    body {
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      background: #1f2937;
      color: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    .camera-box {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    .status {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      background: #e5e7eb;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }

    .status.ok {
      background: #dcfce7;
      color: #166534;
    }

    .status.erro {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.aviso {
      background: #fef3c7;
      color: #92400e;
    }

    .resultado {
      margin-top: 15px;
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
      display: none;
    }

    .resultado.show {
      display: block;
    }

    .resultado h2 {
      margin: 0 0 15px;
      text-align: center;
      font-size: 20px;
    }

    .resultado-linha {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }

    .resultado-linha:last-child {
      border-bottom: none;
    }

    .resultado-linha strong {
      display: inline-block;
      min-width: 90px;
    }

    .movimento {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .entrada {
      background: #dcfce7;
      color: #166534;
    }

    .saida {
      background: #fee2e2;
      color: #991b1b;
    }

    .historico {
      margin-top: 15px;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
    }

    .historico h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .historico-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .historico-item:last-child {
      border-bottom: none;
    }

    .debug {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #111827;
      color: #d1d5db;
      font-size: 11px;
      word-break: break-word;
      display: none;
    }

    .botao {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #1f2937;
      color: white;
    }

    .botao:active {
      transform: scale(0.98);
    }

    .botao-secundario {
      background: #6b7280;
    }

    .carregando {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .header h1 {
        font-size: 19px;
      }

      .header p {
        font-size: 13px;
      }

      .resultado-linha {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 PORTARIA</h1>
    <p>Leitor automático de crachá</p>
  </div>

  <div class="camera-box">

    <div id="reader"></div>

    <div id="status" class="status aviso">
      Iniciando câmera...
    </div>

    <div id="debug" class="debug"></div>

    <button
      id="btnCamera"
      class="botao"
      onclick="iniciarCameraManual()"
      style="display:none;"
    >
      📷 INICIAR CÂMERA
    </button>

  </div>


  <!-- RESULTADO -->
  <div id="resultado" class="resultado">

    <h2>✅ REGISTRO REALIZADO</h2>

    <div class="resultado-linha">
      <strong>Nome:</strong>
      <span id="resNome">-</span>
    </div>

    <div class="resultado-linha">
      <strong>Crachá:</strong>
      <span id="resCracha">-</span>
    </div>

    <div class="resultado-linha">
      <strong>Função:</strong>
      <span id="resFuncao">-</span>
    </div>

    <div class="resultado-linha">
      <strong>Empresa:</strong>
      <span id="resEmpresa">-</span>
    </div>

    <div class="resultado-linha">
      <strong>Horário:</strong>
      <span id="resHorario">-</span>
    </div>

    <div id="resMovimento" class="movimento">
      -
    </div>

  </div>


  <!-- HISTÓRICO -->
  <div class="historico">

    <h2>📋 Últimos registros</h2>

    <div id="historicoLista">
      Nenhum registro ainda.
    </div>

    <button
      class="botao botao-secundario"
      onclick="limparHistorico()"
    >
      Limpar histórico
    </button>

  </div>

</div>


<script>

  /************************************************************
   * CONFIGURAÇÃO
   ************************************************************/

  const API_URL =
    'https://script.google.com/macros/s/AKfycbyZBhTKwNDK8-DEnZIdjFS2krTDGtU4IrOOC_QqDO1cUJuOc90BW5HlC3pQTZsfJsF_/exec';


  /************************************************************
   * VARIÁVEIS
   ************************************************************/

  let scanner = null;

  let cameraIniciada = false;

  let processando = false;

  let ultimoCodigo = '';

  let ultimoCodigoTempo = 0;

  const TEMPO_ANTI_DUPLICACAO = 5000;


  /************************************************************
   * ELEMENTOS
   ************************************************************/

  const statusEl =
    document.getElementById('status');

  const debugEl =
    document.getElementById('debug');

  const resultadoEl =
    document.getElementById('resultado');

  const historicoLista =
    document.getElementById('historicoLista');

  const btnCamera =
    document.getElementById('btnCamera');


  /************************************************************
   * STATUS
   ************************************************************/

  function status(texto, tipo = '') {

    statusEl.textContent = texto;

    statusEl.className =
      'status ' + tipo;

  }


  /************************************************************
   * DEBUG
   ************************************************************/

  function debug(texto) {

    console.log(texto);

    debugEl.style.display = 'block';

    debugEl.textContent = texto;

  }


  /************************************************************
   * INICIALIZAÇÃO
   ************************************************************/

  window.addEventListener('load', function() {

    setTimeout(function() {

      iniciarCamera();

    }, 500);

  });


  /************************************************************
   * INICIAR CÂMERA
   ************************************************************/

  async function iniciarCamera() {

    if (cameraIniciada) {
      return;
    }

    status(
      'Solicitando acesso à câmera...',
      'aviso'
    );

    debug(
      'Preparando câmera...'
    );

    try {

      /*
       * Se existir scanner anterior,
       * tenta encerrá-lo.
       */

      if (scanner) {

        try {
          await scanner.stop();
        } catch (e) {}

        try {
          await scanner.clear();
        } catch (e) {}

      }


      /*
       * Cria novo leitor.
       */

      scanner =
        new Html5Qrcode('reader');


      /*
       * Configuração básica.
       *
       * Não utilizamos "exact" na câmera traseira,
       * pois alguns celulares retornam erro quando
       * essa restrição é obrigatória.
       */

      const config = {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const tamanho =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: Math.floor(tamanho),
            height: Math.floor(tamanho)
          };

        },

        aspectRatio: 1.0,

        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],

        rememberLastUsedCamera: true

      };


      /*
       * Tenta câmera traseira.
       */

      await scanner.start(

        {
          facingMode: {
            ideal: 'environment'
          }
        },

        config,

        function(decodedText) {

          qrDetectado(decodedText);

        },

        function(errorMessage) {

          /*
           * Não mostramos os erros normais
           * de leitura para não poluir a tela.
           */

        }

      );


      cameraIniciada = true;

      btnCamera.style.display = 'none';

      status(
        '🟢 CÂMERA ATIVA — APONTE PARA O QR CODE',
        'ok'
      );

      debug(
        'Câmera ativa. Aguardando QR Code...'
      );


    } catch (erro) {

      console.error(
        'ERRO AO INICIAR CÂMERA:',
        erro
      );

      cameraIniciada = false;

      btnCamera.style.display = 'block';

      let mensagem =
        obterMensagemErroCamera(erro);

      status(
        '❌ Não foi possível iniciar a câmera.',
        'erro'
      );

      debug(
        'ERRO: ' + mensagem
      );

    }

  }


  /************************************************************
   * INICIAR MANUALMENTE
   ************************************************************/

  async function iniciarCameraManual() {

    btnCamera.style.display = 'none';

    await iniciarCamera();

  }


  /************************************************************
   * TRATAMENTO DO ERRO DA CÂMERA
   ************************************************************/

  function obterMensagemErroCamera(erro) {

    if (!erro) {
      return 'Erro desconhecido.';
    }

    let nome =
      erro.name || '';

    let mensagem =
      erro.message || String(erro);


    if (
      nome === 'NotAllowedError' ||
      mensagem.toLowerCase().includes('permission')
    ) {

      return (
        'Permissão da câmera foi negada. ' +
        'Abra as permissões do navegador e permita o acesso à câmera. ' +
        'Detalhes: ' + mensagem
      );

    }


    if (
      nome === 'NotFoundError'
    ) {

      return (
        'Nenhuma câmera foi encontrada neste dispositivo. ' +
        'Detalhes: ' + mensagem
      );

    }


    if (
      nome === 'NotReadableError'
    ) {

      return (
        'A câmera está sendo utilizada por outro aplicativo ou aba. ' +
        'Feche outros aplicativos que estejam usando a câmera. ' +
        'Detalhes: ' + mensagem
      );

    }


    if (
      nome === 'OverconstrainedError'
    ) {

      return (
        'O navegador não conseguiu atender às configurações da câmera. ' +
        'Detalhes: ' + mensagem
      );

    }


    if (
      nome === 'SecurityError'
    ) {

      return (
        'O navegador bloqueou o acesso à câmera por segurança. ' +
        'Verifique se o site está sendo acessado por HTTPS. ' +
        'Detalhes: ' + mensagem
      );

    }


    return (
      nome +
      ': ' +
      mensagem
    );

  }


  /************************************************************
   * QR CODE DETECTADO
   ************************************************************/

  function qrDetectado(decodedText) {

    if (!decodedText) {
      return;
    }


    console.log(
      'QR DETECTADO:',
      decodedText
    );


    /*
     * Mostra imediatamente que o QR foi encontrado.
     */

    debug(
      'QR DETECTADO: ' + decodedText
    );


    /*
     * Extrai o código do crachá.
     */

    const cracha =
      extrairCracha(decodedText);


    if (!cracha) {

      status(
        '⚠️ QR encontrado, mas o crachá não foi identificado.',
        'aviso'
      );

      debug(
        'QR DETECTADO, porém código inválido: ' +
        decodedText
      );

      return;

    }


    /*
     * Evita registrar o mesmo crachá
     * várias vezes seguidas.
     */

    const agora =
      Date.now();


    if (
      cracha === ultimoCodigo &&
      (agora - ultimoCodigoTempo)
        < TEMPO_ANTI_DUPLICACAO
    ) {

      return;

    }


    ultimoCodigo =
      cracha;

    ultimoCodigoTempo =
      agora;


    /*
     * Se já estiver processando,
     * não inicia outro registro.
     */

    if (processando) {
      return;
    }


    processando = true;


    registrarAcesso(cracha);

  }


  /************************************************************
   * EXTRAIR CRACHÁ
   ************************************************************/

  function extrairCracha(texto) {

    if (!texto) {
      return null;
    }


    texto =
      String(texto).trim();


    /*
     * Caso o QR contenha apenas:
     *
     * CRA - 009
     */

    if (
      /^CRA\s*-\s*\d+$/i.test(texto)
    ) {

      return normalizarCracha(texto);

    }


    /*
     * Caso contenha:
     *
     * CRA-009
     */

    if (
      /^CRA-\d+$/i.test(texto)
    ) {

      return normalizarCracha(texto);

    }


    /*
     * Caso o QR contenha uma URL:
     *
     * https://...
     * ?id=CRA%20-%20009
     */

    try {

      const url =
        new URL(texto);


      const id =
        url.searchParams.get('id');


      if (id) {

        return normalizarCracha(id);

      }

    } catch (e) {

      /*
       * Não era uma URL.
       */

    }


    /*
     * Procura o padrão dentro do texto.
     */

    const encontrado =
      texto.match(
        /CRA\s*-\s*\d+/i
      );


    if (encontrado) {

      return normalizarCracha(
        encontrado[0]
      );

    }


    return null;

  }


  /************************************************************
   * NORMALIZAR CRACHÁ
   *
   * IMPORTANTE:
   * O sistema atual utiliza:
   *
   * CRA - 009
   *
   * e não:
   *
   * CRA-009
   ************************************************************/

  function normalizarCracha(valor) {

    if (!valor) {
      return null;
    }


    valor =
      decodeURIComponent(
        String(valor)
      );


    valor =
      valor
        .replace(/\s+/g, ' ')
        .trim();


    const match =
      valor.match(
        /^CRA\s*-\s*(\d+)$/i
      );


    if (!match) {

      return valor;

    }


    const numero =
      match[1];


    return (
      'CRA - ' +
      numero
    );

  }


  /************************************************************
   * REGISTRAR ACESSO
   ************************************************************/

  function registrarAcesso(cracha) {

    status(
      '⏳ Registrando ' + cracha + '...',
      'aviso'
    );


    /*
     * Usamos JSONP porque o leitor está
     * hospedado fora do Apps Script.
     */

    const callback =
      'callback_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 100000
      );


    let finalizado =
      false;


    /*
     * Função que recebe a resposta
     * do Apps Script.
     */

    window[callback] =
      function(resposta) {

        if (finalizado) {
          return;
        }

        finalizado = true;


        /*
         * Remove a função global.
         */

        try {
          delete window[callback];
        } catch (e) {}


        processando = false;


        /*
         * Verifica resposta.
         */

        if (
          !resposta ||
          resposta.sucesso !== true
        ) {

          const erro =
            resposta &&
            resposta.erro
              ? resposta.erro
              : 'Erro desconhecido.';


          status(
            '❌ ' + erro,
            'erro'
          );


          debug(
            'ERRO AO REGISTRAR: ' +
            erro
          );


          return;

        }


        /*
         * Registro realizado.
         */

        mostrarResultado(
          resposta
        );


        adicionarHistorico(
          resposta
        );


        status(
          '🟢 ' +
          resposta.movimento +
          ' registrada com sucesso.',
          'ok'
        );


        debug(
          'Registro concluído: ' +
          resposta.cracha +
          ' - ' +
          resposta.movimento
        );


        /*
         * Depois de alguns segundos,
         * volta para o modo de leitura.
         */

        setTimeout(
          function() {

            resultadoEl.classList.remove(
              'show'
            );

            status(
              '🟢 CÂMERA ATIVA — APONTE PARA O PRÓXIMO QR CODE',
              'ok'
            );

            debug(
              'Aguardando próximo QR Code...'
            );

          },
          2500
        );

      };


    /*
     * Cria script JSONP.
     */

    const script =
      document.createElement('script');


    /*
     * IMPORTANTE:
     * encodeURIComponent garante que:
     *
     * CRA - 009
     *
     * seja enviado corretamente.
     */

    const url =
      API_URL +
      '?acao=registrar' +
      '&id=' +
      encodeURIComponent(cracha) +
      '&callback=' +
      encodeURIComponent(callback);


    script.src =
      url;


    script.async =
      true;


    /*
     * Timeout de segurança.
     */

    const timeout =
      setTimeout(
        function() {

          if (finalizado) {
            return;
          }


          finalizado = true;

          processando = false;


          try {
            delete window[callback];
          } catch (e) {}


          status(
            '❌ Tempo excedido ao comunicar com o sistema.',
            'erro'
          );


          debug(
            'TIMEOUT: o Apps Script não respondeu.'
          );


          try {
            script.remove();
          } catch (e) {}

        },
        15000
      );


    script.onload =
      function() {

        clearTimeout(timeout);

      };


    script.onerror =
      function() {

        clearTimeout(timeout);


        if (finalizado) {
          return;
        }


        finalizado = true;

        processando = false;


        try {
          delete window[callback];
        } catch (e) {}


        status(
          '❌ Erro de comunicação com o sistema.',
          'erro'
        );


        debug(
          'Falha ao acessar a API do Apps Script.'
        );

      };


    document.body.appendChild(
      script
    );

  }


  /************************************************************
   * MOSTRAR RESULTADO
   ************************************************************/

  function mostrarResultado(resposta) {

    document.getElementById(
      'resNome'
    ).textContent =
      resposta.nome || '-';


    document.getElementById(
      'resCracha'
    ).textContent =
      resposta.cracha || '-';


    document.getElementById(
      'resFuncao'
    ).textContent =
      resposta.funcao || '-';


    document.getElementById(
      'resEmpresa'
    ).textContent =
      resposta.empresa || '-';


    document.getElementById(
      'resHorario'
    ).textContent =
      resposta.horario || '-';


    const movimentoEl =
      document.getElementById(
        'resMovimento'
      );


    movimentoEl.textContent =
      resposta.movimento || '-';


    movimentoEl.className =
      'movimento';


    if (
      String(resposta.movimento)
        .toUpperCase()
        === 'ENTRADA'
    ) {

      movimentoEl.classList.add(
        'entrada'
      );

      movimentoEl.textContent =
        '🟢 ENTRADA';

    } else {

      movimentoEl.classList.add(
        'saida'
      );

      movimentoEl.textContent =
        '🔴 SAÍDA';

    }


    resultadoEl.classList.add(
      'show'
    );

  }


  /************************************************************
   * HISTÓRICO
   ************************************************************/

  function adicionarHistorico(resposta) {

    const registro = {

      nome:
        resposta.nome || '-',

      cracha:
        resposta.cracha || '-',

      movimento:
        resposta.movimento || '-',

      horario:
        resposta.horario || '-',

      timestamp:
        Date.now()

    };


    let historico =
      obterHistorico();


    historico.unshift(
      registro
    );


    /*
     * Mantém somente os últimos 20.
     */

    historico =
      historico.slice(
        0,
        20
      );


    salvarHistorico(
      historico
    );


    renderizarHistorico();

  }


  /************************************************************
   * OBTER HISTÓRICO
   ************************************************************/

  function obterHistorico() {

    try {

      const dados =
        localStorage.getItem(
          'historicoPortaria'
        );


      if (!dados) {
        return [];
      }


      const historico =
        JSON.parse(dados);


      if (
        !Array.isArray(historico)
      ) {

        return [];

      }


      return historico;

    } catch (e) {

      return [];

    }

  }


  /************************************************************
   * SALVAR HISTÓRICO
   ************************************************************/

  function salvarHistorico(historico) {

    try {

      localStorage.setItem(
        'historicoPortaria',
        JSON.stringify(historico)
      );

    } catch (e) {

      console.error(
        'Erro ao salvar histórico:',
        e
      );

    }

  }


  /************************************************************
   * RENDERIZAR HISTÓRICO
   ************************************************************/

  function renderizarHistorico() {

    const historico =
      obterHistorico();


    if (
      historico.length === 0
    ) {

      historicoLista.innerHTML =
        'Nenhum registro ainda.';

      return;

    }


    historicoLista.innerHTML =
      historico
        .map(
          function(item) {

            let classe =
              String(item.movimento)
                .toUpperCase()
                === 'ENTRADA'
                ? 'entrada'
                : 'saida';


            return `
              <div class="historico-item">

                <strong>
                  ${escapar(item.nome)}
                </strong>

                <br>

                Crachá:
                ${escapar(item.cracha)}

                <br>

                <span class="${classe}">
                  ${escapar(item.movimento)}
                </span>

                —
                ${escapar(item.horario)}

              </div>
            `;

          }
        )
        .join('');

  }


  /************************************************************
   * LIMPAR HISTÓRICO
   ************************************************************/

  function limparHistorico() {

    const confirmar =
      confirm(
        'Deseja realmente limpar o histórico deste dispositivo?'
      );


    if (!confirmar) {
      return;
    }


    localStorage.removeItem(
      'historicoPortaria'
    );


    renderizarHistorico();

  }


  /************************************************************
   * ESCAPAR HTML
   ************************************************************/

  function escapar(valor) {

    if (
      valor === null ||
      valor === undefined
    ) {

      return '';

    }


    return String(valor)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  /************************************************************
   * CARREGAR HISTÓRICO AO ABRIR
   ************************************************************/

  renderizarHistorico();


</script>

</body>
</html>
